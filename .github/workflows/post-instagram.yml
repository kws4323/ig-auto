name: 인스타그램 카드뉴스 발행

# 컴퓨터가 꺼져 있어도 GitHub 서버에서 실행됩니다.
# 1) Actions 탭 > 이 워크플로 > "Run workflow" 로 수동 실행
# 2) 필요하면 아래 schedule 주석을 해제해 매일 자동 실행 (cron은 UTC 기준)
on:
  workflow_dispatch:
    inputs:
      caption:
        description: "게시물 캡션 (비워두면 기본 문구 사용)"
        required: false
        default: ""
  # schedule:
  #   - cron: "30 6 * * 1-5"   # 매주 평일 15:30 KST(=06:30 UTC)에 자동 발행하려면 주석 해제

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 이미지 URL 목록 구성
        id: images
        run: |
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/images"
          URLS=""
          for f in $(ls images | sort -V); do
            if [ -z "$URLS" ]; then
              URLS="$BASE/$f"
            else
              URLS="$URLS,$BASE/$f"
            fi
          done
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"
          echo "구성된 이미지 URL: $URLS"

      - name: 인스타그램에 캐러셀 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_URLS: ${{ steps.images.outputs.urls }}
          CAPTION: ${{ github.event.inputs.caption }}
        run: python3 post_instagram_carousel.py
